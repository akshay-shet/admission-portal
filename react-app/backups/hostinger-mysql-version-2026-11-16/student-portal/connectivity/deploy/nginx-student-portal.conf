# /etc/nginx/sites-available/student-portal   (Hostinger VPS · Ubuntu)
# Enable:  sudo ln -s /etc/nginx/sites-available/student-portal /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo apt install -y certbot python3-certbot-nginx && sudo certbot --nginx -d portal.example.com
server {
    listen 80;
    server_name portal.example.com;              # <- your domain or sub-domain (DNS A record → the VPS IP)
    client_max_body_size 64m;                    # backup restores and photos
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;        # the backend (npm start / PM2)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
    }
    location /api/events {                       # live updates (Server-Sent Events): no buffering, long-lived
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
