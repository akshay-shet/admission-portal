# /etc/nginx/sites-available/student-portal  (Hostinger VPS, Ubuntu)
# then: ln -s /etc/nginx/sites-available/student-portal /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS: apt install certbot python3-certbot-nginx && certbot --nginx -d portal.example.com
server {
    listen 80;
    server_name portal.example.com;          # <- your domain / subdomain
    client_max_body_size 60m;                # backups and photos
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;                 # live updates (Server-Sent Events)
        proxy_read_timeout 1h;
        access_log off;                      # live-update stream (uses a one-minute ticket, not the login token)
    }
}
